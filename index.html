<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="GraphLab is a free interactive graphing calculator for functions, equations, inequalities, polar and parametric curves, sliders, and 3D surfaces.">
<meta name="theme-color" content="#fbfaf7">
<meta property="og:type" content="website">
<meta property="og:title" content="GraphLab – Graphing Calculator">
<meta property="og:description" content="Plot equations, explore functions, animate sliders, and export graphs as PNG images.">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<title>GraphLab – Free Online Graphing Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>
<style>
:root{--bg:#fbfaf7;--panel:#f1efe9;--text:#1c2430;--muted:#6f7684;--line:#dcd8cd;--grid:#ebe8df;--grid2:#d6d2c5;--axis:#2b3340;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--panel:#1a2029;--text:#e6e9ee;--muted:#8a93a3;--line:#2a323e;--grid:#1c222b;--grid2:#2b3440;--axis:#c3cad6;--card:#202733}}
:root[data-theme="dark"]{--bg:#12161c;--panel:#1a2029;--text:#e6e9ee;--muted:#8a93a3;--line:#2a323e;--grid:#1c222b;--grid2:#2b3440;--axis:#c3cad6;--card:#202733}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:350px 1fr;height:100%}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sh{display:flex;gap:6px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.sh b{font:700 18px Georgia,"Times New Roman",serif;margin-right:auto}
.sh select,.sh button,.tools button,#keys button{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}
.sh select{max-width:110px}
#keys{display:flex;gap:4px;padding:6px 10px;overflow-x:auto;border-bottom:1px solid var(--line);flex:none}
#keys button{padding:2px 8px;white-space:nowrap}
#list{overflow:auto;flex:1}
.row{display:flex;gap:6px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.row:focus-within{box-shadow:inset 3px 0 0 #2d70b3}
.row.off .expr{opacity:.45}
.dot{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:0;padding:0;border-radius:50%;background:none;cursor:pointer;flex:none;margin-top:3px}
.dot::-webkit-color-swatch-wrapper{padding:0}.dot::-webkit-color-swatch{border:0;border-radius:50%}.dot::-moz-color-swatch{border:0;border-radius:50%}
.main{flex:1;min-width:0}
.expr{width:100%;box-sizing:border-box;border:0;background:none;outline:0;font:16px "Cascadia Code",Consolas,monospace;padding:4px 0}
.row button{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px}
.row.off .eye{opacity:.35}
.err{color:#c74440;font-size:12px}.res{color:var(--muted);font-family:monospace}
.sl{display:flex;gap:4px;align-items:center;margin-top:2px}
.sl input[type=number]{width:44px;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:1px 3px;font-size:12px}
.sl input[type=range]{flex:1;min-width:0}
#gm{position:relative;min-height:0;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.tools button{width:36px;height:36px;font-size:18px;padding:0}
#coord{position:absolute;left:10px;bottom:8px;font:12px monospace;color:var(--muted);background:var(--bg);padding:1px 6px;border-radius:4px}
dialog{max-width:520px;width:calc(100% - 28px);border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 4px;font:700 20px Georgia,serif}
dialog ul{list-style:none;padding:0;margin:8px 0;max-height:62vh;overflow:auto}
dialog li{padding:7px 0;border-bottom:1px solid var(--line)}
dialog li button{float:right;font:12px monospace;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:3px 7px;cursor:pointer;margin-left:8px;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
dialog small{color:var(--muted);display:block}
@media (max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:50% 50%}#gm{order:-1}#side{border-right:0;border-top:1px solid var(--line)}}
</style></head><body>
<div id="app">
<aside id="side">
 <div class="sh"><b>GraphLab</b><select id="ex"><option value="">Examples</option></select><button id="add" title="Add expression">＋</button><button id="feat">Features</button></div>
 <div id="keys"></div>
 <div id="list"></div>
</aside>
<main id="gm"><canvas id="cv"></canvas>
 <div class="tools"><button id="zi" title="Zoom in">＋</button><button id="zo" title="Zoom out">－</button><button id="hm" title="Reset view">⌂</button><button id="th" title="Light / dark">◐</button><button id="d3" title="2D / 3D" style="font-size:13px">3D</button><button id="ex2" title="Save graph as PNG image">⤓</button></div>
 <div id="coord">(0, 0)</div>
</main></div>
<dialog id="dlg"><h2>What you can graph</h2><small>Tap a sample to add it to your list.</small><ul id="fl"></ul><button id="cl" style="float:right;padding:5px 12px;cursor:pointer">Close</button></dialog>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d'),list=$('#list');
const PAL=['#c74440','#2d70b3','#388c46','#6042a6','#fa7e19','#1c2430'];
const SKIP=new Set(['x','y','z','t','r','theta','pi','e','i','tau','phi']);
const KEY='graphlab-v1',HOME=()=>({cx:0,cy:0,s:44});
let items=[],view=HOME(),nid=1,W=0,H=0,dpr=1,hover=null,lastIn=null,q=0,theme='';
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const X=x=>W/2+(x-view.cx)*view.s,Y=y=>H/2-(y-view.cy)*view.s,wx=p=>view.cx+(p-W/2)/view.s,wy=p=>view.cy-(p-H/2)/view.s;
const fmt=v=>{const a=Math.abs(v);if(a<1e-12)return'0';if(a>=1e6||a<1e-4)return v.toExponential(2);return String(+v.toFixed(5))};
const nice=r=>{const p=10**Math.floor(Math.log10(r)),f=r/p;return(f<1.5?1:f<3.5?2:f<7.5?5:10)*p};

/* ---------- parsing ---------- */
function prep(s){return s.replace(/π/g,'pi').replace(/θ/g,'theta').replace(/≤/g,'<=').replace(/≥/g,'>=').replace(/\bln\(/g,'§(').replace(/\blog\(/g,'log10(').replace(/§\(/g,'log(').replace(/√\s*\(/g,'sqrt(').replace(/√\s*([\w.]+)/g,'sqrt($1)').replace(/\|([^|]+)\|/g,'abs($1)')}
function comp(s){const n=math.parse(s),syms=new Set();n.traverse((a,p,par)=>{if(a.isSymbolNode&&!(par&&par.isFunctionNode&&p==='fn'))syms.add(a.name)});return{code:n.compile(),syms}}
function ev(c,S){try{const v=c.code.evaluate(S);return typeof v==='number'?v:typeof v==='boolean'?+v:NaN}catch(e){return NaN}}
function splitTop(s){let d=0,o=[],c=0;for(let i=0;i<s.length;i++){const h=s[i];if('([{'.includes(h))d++;else if(')]}'.includes(h))d--;else if(h===','&&!d){o.push(s.slice(c,i));c=i+1}}o.push(s.slice(c));return o}
const onlyConst=c=>[...c.syms].every(s=>['pi','e','tau','phi'].includes(s));
function parse(raw){
 let t=prep(raw).trim();if(!t)return{type:'empty'};
 let b=null,m=t.match(/\{\s*(.+?)\s*<=?\s*(?:t|theta)\s*<=?\s*(.+?)\s*\}\s*$/);
 if(m){b=[m[1],m[2]].map(s=>ev(comp(s),{}));t=t.slice(0,m.index).trim()}
 if(t[0]==='('&&t.endsWith(')')){const p=splitTop(t.slice(1,-1));if(p.length===2){const a=comp(p[0]),c=comp(p[1]);return{type:(a.syms.has('t')||c.syms.has('t'))?'param':'point',a,c,rng:b,syms:new Set([...a.syms,...c.syms])}}}
 if(m=t.match(/^([a-zA-Z])\(([a-zA-Z])\)\s*=\s*(.+)$/)){const c=comp(m[3]);return{type:'func',name:m[1],arg:m[2],c,syms:c.syms}}
 const op=t.match(/<=|>=|<|>/);
 if(op){const c=comp(`(${t.slice(0,op.index)})-(${t.slice(op.index+op[0].length)})`);return{type:'ineq',op:op[0],c,syms:c.syms}}
 const eq=t.indexOf('=');
 if(eq>0){const l=t.slice(0,eq).trim(),r=t.slice(eq+1).trim(),rc=comp(r);
  if(/^[a-zA-Z]\w*$/.test(l)&&!['x','y','z','r','t','theta'].includes(l)&&onlyConst(rc))return{type:'var',name:l,value:ev(rc,{}),syms:new Set()};
  if(l==='z')return{type:'surf',c:rc,syms:rc.syms};
  if(l==='y'&&!rc.syms.has('y'))return{type:'fn',c:rc,syms:rc.syms};
  if(l==='r')return{type:'polar',c:rc,syms:rc.syms};
  const c=comp(`(${l})-(${r})`);return{type:'imp',c,syms:c.syms}}
 const c=comp(t);
 if(c.syms.has('x')&&!c.syms.has('y'))return{type:'fn',c,syms:c.syms};
 if(onlyConst(c))return{type:'calc',res:math.format(math.evaluate(t),{precision:10}),syms:c.syms};
 throw new Error('Add "y =" or an equals sign to graph this');
}
function reparse(it){it.err='';try{it.p=parse(it.text);if(it.p.type==='var')it.val=it.p.value}catch(e){it.p=null;it.err=String(e.message).split('\n')[0].slice(0,90)}}
function mk(text=''){const it={id:nid++,text,color:PAL[items.length%PAL.length],vis:true,min:-10,max:10,play:false};items.push(it);reparse(it);return it}
function scope(){const S={};items.forEach(i=>{if(i.p&&i.p.type==='var')S[i.p.name]=i.val});
 items.forEach(i=>{const p=i.p;if(p&&p.type==='func')S[p.name]=v=>{const o=S[p.arg];S[p.arg]=v;const r=ev(p.c,S);S[p.arg]=o;return r}});return S}
function autoVars(){const known=new Set(),need=[];items.forEach(i=>{if(i.p&&(i.p.type==='var'||i.p.type==='func'))known.add(i.p.name)});
 items.forEach(i=>{const p=i.p;if(!p||!p.syms)return;p.syms.forEach(s=>{if(p.type==='func'&&s===p.arg)return;if(/^[a-zA-Z]$/.test(s)&&!SKIP.has(s)&&!known.has(s)&&math[s]===undefined){known.add(s);need.push([s,i])}})});
 need.forEach(([s,i])=>{const n={id:nid++,text:s+'=1',color:PAL[items.length%PAL.length],vis:true,min:-10,max:10,play:false};items.splice(items.indexOf(i),0,n);reparse(n)});
 if(need.length){renderList();sched()}}

/* ---------- drawing ---------- */
function grid(){
 ctx.fillStyle=css('--bg');ctx.fillRect(0,0,W,H);
 const maj=nice(90/view.s),x0=wx(0),x1=wx(W),y0=wy(H),y1=wy(0);
 const lines=(st,col)=>{ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();
  for(let k=Math.ceil(x0/st);k*st<=x1;k++){const p=Math.round(X(k*st))+.5;ctx.moveTo(p,0);ctx.lineTo(p,H)}
  for(let k=Math.ceil(y0/st);k*st<=y1;k++){const p=Math.round(Y(k*st))+.5;ctx.moveTo(0,p);ctx.lineTo(W,p)}ctx.stroke()};
 lines(maj/5,css('--grid'));lines(maj,css('--grid2'));
 ctx.strokeStyle=css('--axis');ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(X(0),0);ctx.lineTo(X(0),H);ctx.moveTo(0,Y(0));ctx.lineTo(W,Y(0));ctx.stroke();
 ctx.fillStyle=css('--muted');ctx.font='11px monospace';
 const ty=Math.min(Math.max(Y(0)+14,14),H-6),tx=Math.min(Math.max(X(0)-6,34),W-6);
 ctx.textAlign='center';for(let k=Math.ceil(x0/maj);k*maj<=x1;k++)if(k)ctx.fillText(fmt(k*maj),X(k*maj),ty);
 ctx.textAlign='right';for(let k=Math.ceil(y0/maj);k*maj<=y1;k++)if(k)ctx.fillText(fmt(k*maj),tx,Y(k*maj)+4);
}
function trace(pts){ // pts: iterator of [sx,sy]
 ctx.beginPath();let pen=false,px=0,py=0;
 for(const[a,b]of pts){if(!isFinite(a)||!isFinite(b)||Math.abs(b)>1e6||Math.abs(a)>1e6){pen=false;continue}
  if(pen&&Math.hypot(a-px,b-py)>Math.max(W,H))pen=false;pen?ctx.lineTo(a,b):ctx.moveTo(a,b);pen=true;px=a;py=b}ctx.stroke()}
function*fnPts(c,S){for(let p=0;p<=W;p++){S.x=wx(p);yield[p,Y(ev(c,S))]}delete S.x}
function*rangePts(f,lo,hi,n){for(let k=0;k<=n;k++)yield f(lo+(hi-lo)*k/n)}
function implicit(c,S){
 const cs=5,nx=Math.ceil(W/cs)+1,ny=Math.ceil(H/cs)+1,v=new Float64Array(nx*ny);
 for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){S.x=wx(i*cs);S.y=wy(j*cs);v[j*nx+i]=ev(c,S)}
 delete S.x;delete S.y;ctx.beginPath();
 for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){
  const a=v[j*nx+i],b=v[j*nx+i+1],d=v[(j+1)*nx+i],e=v[(j+1)*nx+i+1];if(a!==a||b!==b||d!==d||e!==e)continue;
  const pts=[],x=i*cs,y=j*cs,ed=(p,r,x0,y0,x1,y1)=>{if((p>0)!==(r>0)){const t=p/(p-r);pts.push([x0+(x1-x0)*t,y0+(y1-y0)*t])}};
  ed(a,b,x,y,x+cs,y);ed(b,e,x+cs,y,x+cs,y+cs);ed(d,e,x,y+cs,x+cs,y+cs);ed(a,d,x,y,x,y+cs);
  if(pts.length>=2){ctx.moveTo(...pts[0]);ctx.lineTo(...pts[1])}if(pts.length===4){ctx.moveTo(...pts[2]);ctx.lineTo(...pts[3])}}
 ctx.stroke()}
function shade(p,S,color){
 const cs=3,nx=Math.ceil(W/cs),ny=Math.ceil(H/cs),oc=document.createElement('canvas');oc.width=nx;oc.height=ny;
 const o=oc.getContext('2d'),id=o.createImageData(nx,ny),rgb=[1,3,5].map(k=>parseInt(color.substr(k,2),16)),inc=p.op.length>1,gt=p.op[0]==='>';
 for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){S.x=wx(i*cs+cs/2);S.y=wy(j*cs+cs/2);const v=ev(p.c,S);
  if(gt?(inc?v>=0:v>0):(inc?v<=0:v<0))id.data.set([...rgb,70],(j*nx+i)*4)}
 o.putImageData(id,0,0);ctx.imageSmoothingEnabled=false;ctx.drawImage(oc,0,0,nx*cs,ny*cs);ctx.imageSmoothingEnabled=true;
 ctx.setLineDash(inc?[]:[7,6]);implicit(p.c,S);ctx.setLineDash([])}
function draw(){
 if(!W)return;ctx.setTransform(dpr,0,0,dpr,0,0);if(mode3)return draw3();grid();const S=scope();
 for(const it of items){const p=it.p;if(!it.vis||!p)continue;ctx.strokeStyle=ctx.fillStyle=it.color;ctx.lineWidth=2.5;ctx.lineJoin='round';
  if(p.type==='fn')trace(fnPts(p.c,S));
  else if(p.type==='imp')implicit(p.c,S);
  else if(p.type==='ineq')shade(p,S,it.color);
  else if(p.type==='polar')trace(rangePts(th=>{S.theta=th;const r=ev(p.c,S);return[X(r*Math.cos(th)),Y(r*Math.sin(th))]},0,6*Math.PI,3000));
  else if(p.type==='param'){const[lo,hi]=p.rng||[-10,10];trace(rangePts(t=>{S.t=t;return[X(ev(p.a,S)),Y(ev(p.c,S))]},lo,hi,2000))}
  else if(p.type==='point'){const a=ev(p.a,S),b=ev(p.c,S);if(isFinite(a)&&isFinite(b)){ctx.beginPath();ctx.arc(X(a),Y(b),5.5,0,7);ctx.fill();ctx.font='12px monospace';ctx.textAlign='left';ctx.fillText(`(${fmt(a)}, ${fmt(b)})`,X(a)+9,Y(b)-8)}}}
 if(hover){const px=X(hover.x),py=Y(hover.y),tx=`(${fmt(hover.x)}, ${fmt(hover.y)})`;
  ctx.fillStyle=css('--card');ctx.strokeStyle=hover.color;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(px,py,6,0,7);ctx.fill();ctx.stroke();
  ctx.font='12px monospace';const w=ctx.measureText(tx).width+12,bx=Math.min(px+10,W-w-4),by=Math.max(py-30,4);
  ctx.fillStyle=css('--card');ctx.fillRect(bx,by,w,22);ctx.strokeStyle=css('--line');ctx.lineWidth=1;ctx.strokeRect(bx,by,w,22);ctx.fillStyle=css('--text');ctx.textAlign='left';ctx.fillText(tx,bx+6,by+15)}
}
let mode3=false,cam={az:.8,el:.6,z:1};
function setMode(b){mode3=b;hover=null;$('#d3').textContent=b?'2D':'3D';$('#coord').style.display=b?'none':'';sched()}
function draw3(){
 ctx.fillStyle=css('--bg');ctx.fillRect(0,0,W,H);
 const R=5,sc=Math.min(W,H)/(3*R)*cam.z,ca=Math.cos(cam.az),sa=Math.sin(cam.az),ce=Math.cos(cam.el),se=Math.sin(cam.el);
 const P=(x,y,z)=>{const u=x*ca-y*sa,v=x*sa+y*ca;return[W/2+u*sc,H/2-(z*ce+v*se)*sc,v*ce-z*se]};
 const line=(a,b,col,w)=>{const p=P(...a),q=P(...b);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke()};
 for(let k=-R;k<=R;k++){line([k,-R,0],[k,R,0],css('--grid2'),1);line([-R,k,0],[R,k,0],css('--grid2'),1)}
 const ax=css('--axis');line([-R,0,0],[R,0,0],ax,1.6);line([0,-R,0],[0,R,0],ax,1.6);line([0,0,-R],[0,0,R],ax,1.6);
 ctx.fillStyle=ax;ctx.font='13px monospace';ctx.textAlign='center';
 [['x',[R+.4,0,0]],['y',[0,R+.4,0]],['z',[0,0,R+.4]]].forEach(([l,p])=>{const s=P(...p);ctx.fillText(l,s[0],s[1])});
 const S=scope(),N=40,st=2*R/N,quads=[];let n=0;
 for(const it of items){const p=it.p;if(!it.vis||!p||p.type!=='surf')continue;n++;
  const g=[];for(let i=0;i<=N;i++){g.push([]);for(let j=0;j<=N;j++){S.x=-R+i*st;S.y=-R+j*st;g[i].push(ev(p.c,S))}}
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const zs=[g[i][j],g[i+1][j],g[i+1][j+1],g[i][j+1]];if(zs.some(z=>!isFinite(z)||Math.abs(z)>2*R))continue;
   const x0=-R+i*st,x1=x0+st,y0=-R+j*st,y1=y0+st,pts=[P(x0,y0,zs[0]),P(x1,y0,zs[1]),P(x1,y1,zs[2]),P(x0,y1,zs[3])];
   quads.push({pts,d:(pts[0][2]+pts[2][2])/2,z:(zs[0]+zs[2])/2})}}
 delete S.x;delete S.y;quads.sort((a,b)=>b.d-a.d);
 ctx.lineWidth=.6;ctx.strokeStyle='rgba(0,0,0,.22)';
 for(const q of quads){const c=Math.max(-1,Math.min(1,q.z/R));ctx.fillStyle=`hsl(${230-(c+1)*90},65%,56%)`;ctx.beginPath();q.pts.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();ctx.stroke()}
 if(!n){ctx.fillStyle=css('--muted');ctx.font='14px sans-serif';ctx.fillText('Type z = sin(x)*cos(y) to plot a surface',W/2,H-20)}
}
async function exportImg(){
 hover=null;draw();const b=await new Promise(r=>cv.toBlob(r,'image/png'));if(!b)return;
 let d=null;try{d=window.claude&&await claude.use('downloads')}catch(e){}
 if(d){try{await d.save({filename:'graph.png',data:b})}catch(e){}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='graph.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function sched(){if(!q){q=1;requestAnimationFrame(()=>{q=0;draw()})}}
function size(){const r=$('#gm').getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;sched()}
new ResizeObserver(size).observe($('#gm'));

/* ---------- view interaction ---------- */
function zoomAt(px,py,k){if(mode3){cam.z=Math.min(Math.max(cam.z*k,.25),8);return}const ns=Math.min(Math.max(view.s*k,.02),1e6),x=wx(px),y=wy(py);view.s=ns;view.cx=x-(px-W/2)/ns;view.cy=y+(py-H/2)/ns}
const ptrs=new Map();let pd=0;
const pdist=()=>{if(ptrs.size<2)return 0;const[a,b]=[...ptrs.values()];return Math.hypot(a[0]-b[0],a[1]-b[1])};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);pd=pdist();hover=null};
cv.onpointermove=e=>{const cur=[e.offsetX,e.offsetY],prev=ptrs.get(e.pointerId);
 if(!mode3)$('#coord').textContent=`(${fmt(wx(cur[0]))}, ${fmt(wy(cur[1]))})`;
 if(prev){ptrs.set(e.pointerId,cur);
  if(ptrs.size===1){if(mode3){cam.az-=(cur[0]-prev[0])*.01;cam.el=Math.max(-1.5,Math.min(1.5,cam.el+(cur[1]-prev[1])*.01))}else{view.cx-=(cur[0]-prev[0])/view.s;view.cy+=(cur[1]-prev[1])/view.s}}
  else if(ptrs.size===2){const d=pdist(),[a,b]=[...ptrs.values()];if(pd)zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,d/pd);pd=d}
  sched();return}
 hover=null;if(mode3)return;const S=scope(),x=wx(cur[0]);let best=14;
 for(const it of items){if(!it.vis||!it.p||it.p.type!=='fn')continue;S.x=x;const y=ev(it.p.c,S),d=Math.abs(Y(y)-cur[1]);if(d<best){best=d;hover={x,y,color:it.color}}}
 sched()};
cv.onpointerup=cv.onpointercancel=e=>{ptrs.delete(e.pointerId);pd=pdist();save()};
cv.onpointerleave=()=>{hover=null;sched()};
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,Math.exp(-e.deltaY*.0015));sched();save()},{passive:false});
$('#zi').onclick=()=>{zoomAt(W/2,H/2,1.35);sched();save()};
$('#zo').onclick=()=>{zoomAt(W/2,H/2,1/1.35);sched();save()};
$('#hm').onclick=()=>{view=HOME();cam={az:.8,el:.6,z:1};sched();save()};
$('#d3').onclick=()=>setMode(!mode3);$('#ex2').onclick=()=>exportImg();
$('#th').onclick=()=>{const d=css('--bg')==='#12161c';theme=d?'light':'dark';document.documentElement.dataset.theme=theme;sched();save()};

/* ---------- expression list ---------- */
function renderExtra(row,it){const x=row.querySelector('.extra');let h='';
 if(it.err)h=`<div class="err">${esc(it.err)}</div>`;
 else if(it.p&&it.p.type==='var')h=`<div class="sl"><input type="number" class="mn" value="${it.min}"><input type="range" class="rg" min="${it.min}" max="${it.max}" step="0.01" value="${it.val}"><input type="number" class="mx" value="${it.max}"><button class="pl" title="Animate">${it.play?'⏸':'▶'}</button></div>`;
 else if(it.p&&it.p.type==='calc')h=`<div class="res">= ${esc(it.p.res)}</div>`;
 x.innerHTML=h}
function rowEl(it){const d=document.createElement('div');d.className='row'+(it.vis?'':' off');d.dataset.id=it.id;
 d.innerHTML=`<input type="color" class="dot" value="${it.color}"><div class="main"><input class="expr" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Type an expression" value="${esc(it.text)}"><div class="extra"></div></div><button class="eye" title="Show / hide">👁</button><button class="del" title="Delete">✕</button>`;
 renderExtra(d,it);return d}
function renderList(){const a=document.activeElement,fid=a&&a.classList&&a.classList.contains('expr')?a.closest('.row').dataset.id:null,pos=fid?a.selectionStart:0;
 list.replaceChildren(...items.map(rowEl));if(fid)focusRow(fid,pos)}
function focusRow(id,pos){const el=list.querySelector(`.row[data-id="${id}"] .expr`);if(el){el.focus();if(pos!=null)el.setSelectionRange(pos,pos)}}
const itOf=el=>items.find(i=>i.id==el.closest('.row').dataset.id);
list.addEventListener('input',e=>{const t=e.target,row=t.closest('.row');if(!row)return;const it=itOf(t),c=t.classList;
 if(c.contains('expr')){it.text=t.value;reparse(it);renderExtra(row,it)}
 else if(c.contains('rg')){it.val=+t.value;it.text=`${it.p.name}=${+it.val.toFixed(3)}`;row.querySelector('.expr').value=it.text;reparse(it)}
 else if(c.contains('mn')||c.contains('mx')){it.min=+row.querySelector('.mn').value;it.max=+row.querySelector('.mx').value;const g=row.querySelector('.rg');g.min=it.min;g.max=it.max}
 else if(c.contains('dot'))it.color=t.value;
 save();sched()});
list.addEventListener('focusin',e=>{if(e.target.classList.contains('expr'))lastIn=e.target});
list.addEventListener('change',e=>{if(e.target.classList.contains('expr'))autoVars()});
list.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const it=itOf(b),row=b.closest('.row');
 if(b.classList.contains('eye')){it.vis=!it.vis;row.classList.toggle('off',!it.vis)}
 else if(b.classList.contains('del')){items.splice(items.indexOf(it),1);if(!items.length)mk('');renderList()}
 else if(b.classList.contains('pl')){it.play=!it.play;b.textContent=it.play?'⏸':'▶';if(it.play)requestAnimationFrame(tick)}
 save();sched()});
list.addEventListener('keydown',e=>{const t=e.target;if(!t.classList.contains('expr'))return;const it=itOf(t);
 if(e.key==='Enter'){e.preventDefault();autoVars();let n=items[items.indexOf(it)+1];if(!n){n=mk('');renderList()}focusRow(n.id)}
 else if(e.key==='Backspace'&&!t.value&&items.length>1){e.preventDefault();const k=items.indexOf(it);items.splice(k,1);renderList();focusRow(items[Math.max(0,k-1)].id);save();sched()}});
$('#add').onclick=()=>{const n=mk('');renderList();focusRow(n.id);list.scrollTop=list.scrollHeight};

/* slider animation */
let lt=0;
function tick(t){const dt=Math.min(t-lt,60);lt=t;let any=false;
 items.forEach(it=>{if(it.play&&it.p&&it.p.type==='var'){any=true;it.dir=it.dir||1;it.val+=it.dir*(it.max-it.min)*dt/5000;
  if(it.val>=it.max){it.val=it.max;it.dir=-1}else if(it.val<=it.min){it.val=it.min;it.dir=1}
  it.text=`${it.p.name}=${+it.val.toFixed(3)}`;const row=list.querySelector(`.row[data-id="${it.id}"]`);
  if(row){row.querySelector('.expr').value=it.text;const g=row.querySelector('.rg');if(g)g.value=it.val}}});
 if(any){draw();requestAnimationFrame(tick)}else lt=0}

/* keypad */
[['x²','^2'],['√','sqrt('],['π','pi'],['|x|','abs('],['sin','sin('],['cos','cos('],['tan','tan('],['ln','ln('],['eˣ','e^'],['÷','/'],['≤','<='],['≥','>='],['θ','theta'],['( , )','(,)']].forEach(([l,v])=>{const b=document.createElement('button');b.textContent=l;b.dataset.v=v;$('#keys').append(b)});
$('#keys').onpointerdown=e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();const i=lastIn&&document.contains(lastIn)?lastIn:document.querySelector('.expr');if(!i)return;
 i.focus();const v=b.dataset.v;i.setRangeText(v,i.selectionStart,i.selectionEnd,'end');if(v==='(,)')i.setSelectionRange(i.selectionStart-2,i.selectionStart-2);i.dispatchEvent(new Event('input',{bubbles:true}))};

/* examples & features */
const EX={'Sliders: waves':['a=1','b=2','y=a*sin(b*x)','y=a*cos(b*x)'],
'Conic sections':['x^2+y^2=25','x^2/16+y^2/9=1','x^2/9-y^2/4=1','y^2=8x'],
'Inequalities':['y>x^2-4','y<-x+3','x^2+y^2<=16'],
'Polar curves':['r=3*cos(3*theta)','r=2+2*cos(theta)'],
'Heart (parametric)':['(16*sin(t)^3, 13*cos(t)-5*cos(2*t)-2*cos(3*t)-cos(4*t)){-pi<=t<=pi}'],
'Lissajous':['a=3','b=2','(4*sin(a*t), 4*sin(b*t)){0<=t<=2*pi}'],
'Functions & points':['f(x)=x^3-3x','y=f(x)','g(x)=3x^2-3','y=g(x)','(1,f(1))','(-1,f(-1))'],
'3D surface':['a=1','z=a*sin(x)*cos(y)*2'],
'Calculator':['sqrt(2)*5!','sin(pi/6)','2^10+log(1000)','12 km to m']};
Object.keys(EX).forEach(k=>$('#ex').add(new Option(k,k)));
function load(arr,v){items=[];arr.forEach(t=>mk(t));autoVars();mk('');if(v)view=v;renderList();sched();save()}
$('#ex').onchange=e=>{const v=e.target.value;if(EX[v]){setMode(v==='3D surface');load(EX[v],v==='Calculator'?null:HOME())}e.target.value=''};
const FEATS=[['Functions of x','y = f(x), with 2x implied as 2·x','y=x^2-2x-3'],['Implicit curves','Any equation in x and y','x^2+y^2=16'],['Vertical lines','','x=2'],['Inequalities','Shaded regions, dashed when strict','y>x^2-4'],['Polar','r in terms of theta','r=2+2cos(theta)'],['Parametric','Optional t range in braces','(3cos(t),2sin(2t)){0<=t<=2pi}'],['Points','Labeled with coordinates','(2,3)'],['Sliders','Undefined letters get sliders automatically; press ▶ to animate','y=m*x+b'],['Custom functions','Define f(x), then use it anywhere','f(x)=x^3-3x'],['Calculator','Results appear under the line','sqrt(2)*5!'],['Trace','Hover over a curve to read exact coordinates',''],['Pan, zoom, pinch','Drag, scroll wheel, or two fingers',''],['Colors & visibility','Tap the dot to recolor, 👁 to hide',''],['Symbol keypad','Row above the list',''],['3D surfaces','Press 3D, then drag to rotate and scroll or pinch to zoom','z=sin(x)*cos(y)*2'],['Export image','The ⤓ button saves the current graph as a PNG',''],['Dark mode, autosave, examples','◐ button, Examples menu','']];
FEATS.forEach(([a,b,c])=>{const li=document.createElement('li');li.innerHTML=(c?`<button data-x="${esc(c)}">${esc(c)}</button>`:'')+`<b>${esc(a)}</b><small>${esc(b)}</small>`;$('#fl').append(li)});
$('#fl').onclick=e=>{const b=e.target.closest('button');if(!b)return;const last=items[items.length-1];if(last&&!last.text)items.pop();mk(b.dataset.x);autoVars();mk('');renderList();if(/^z=/.test(b.dataset.x))setMode(true);$('#dlg').close();sched();save()};
$('#feat').onclick=()=>$('#dlg').showModal();$('#cl').onclick=()=>$('#dlg').close();

/* persistence */
function save(){try{localStorage.setItem(KEY,JSON.stringify({items:items.map(({text,color,vis,min,max})=>({text,color,vis,min,max})),view,theme}))}catch(e){}}
(function init(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 if(s&&Array.isArray(s.items)&&s.items.length){s.items.forEach(o=>{const it=mk(o.text||'');Object.assign(it,{color:o.color||it.color,vis:o.vis!==false,min:o.min??-10,max:o.max??10})});if(s.view&&s.view.s)view=s.view;if(s.theme){theme=s.theme;document.documentElement.dataset.theme=theme}autoVars();renderList()}
 else load(['a=1.5','y=a*sin(x)','y=x^2/4-3','x^2+y^2=9','(1,2)'],HOME())})();
</script></body></html>
